
name: Render Nuclear Submarine Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q submarine-explainer.zip -d project
          echo "ZIP extracted successfully"
          find project -maxdepth 3 -type f | head -100

      - name: Find project and install dependencies
        shell: bash
        run: |
          PROJECT_DIR=$(find project -name package.json -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cd "$PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Prepare Remotion browser
        run: |
          cd "$PROJECT_DIR"
          npx remotion browser ensure

      - name: Render video with software WebGL
        run: |
          cd "$PROJECT_DIR"
          npm run render -- --gl=swangle

      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-submarine-video
          path: |
            project/**/out/*.mp4
            project/**/*.log
          if-no-files-found: warn
          retention-days: 7
