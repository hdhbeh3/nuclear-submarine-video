
name: Render Nuclear Submarine Video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1-mesa-dri libegl1 libgbm1 libxkbcommon0

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -q submarine-explainer.zip -d project
          echo "Project extracted"

      - name: Locate project
        shell: bash
        run: |
          PACKAGE=$(find project -name package.json -not -path '*/node_modules/*' -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install Node dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Check Remotion version
        run: |
          cd "$PROJECT_DIR"
          npx remotion --version

      - name: Prepare browser
        run: |
          cd "$PROJECT_DIR"
          npx remotion browser ensure

      - name: Render with software WebGL
        run: |
          cd "$PROJECT_DIR"
          npx remotion render src/index.ts Submarine out/submarine.mp4 \
            --gl=swangle \
            --concurrency=1 \
            --chromium-flags='{"enable-unsafe-swiftshader":true}'

      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclear-submarine-video
          path: |
            project/**/out/*.mp4
            project/**/*.log
          if-no-files-found: warn
          retention-days: 7
          
